<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทงด้วยกัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single narrow column. First the wish box, then the night river is revealed once the krathong is floated, then the sign-off. */
:root{
  --night:#070B24;
  --sky-glow:#16265A;
  --sky-top:#09113C;
  --sky-low:#1E4278;
  --shore:#050A1C;
  --river-top:#10405C;
  --river-bot:#04111D;
  --moon:#F4E9BE;
  --flame:#FFB454;
  --flame-hi:#FFC878;
  --on-flame:#1B1203;
  --ink:#ECEFFA;
  --mute:#A9B4D6;
  --line:rgba(236,239,250,.18);
  --field:rgba(236,239,250,.07);
  --heart:#F58DAB;
  --font-cute:'Mali','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--night);color:var(--ink);
  font-family:var(--font-cute);font-weight:500;font-size:17px;line-height:1.8;
  padding-block:clamp(20px,4vw,56px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(90% 60% at 88% 0%,var(--sky-glow),transparent 70%),var(--night)}
#stars{position:absolute;inset:0}
#stars span,.pstars span{position:absolute;border-radius:50%;background:var(--moon);opacity:.6;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.12}to{opacity:.85}}

.wrap{position:relative;z-index:1;max-width:640px;margin-inline:auto;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}

.head{position:relative;min-width:0;--hm:clamp(64px,18vw,96px);padding-right:calc(var(--hm) + 14px)}
.head.compact{padding-right:0}
.hmoon{position:absolute;top:0;right:0;width:var(--hm);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFFBE6,var(--moon) 58%,#D8C98F);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 48px 14px rgba(244,233,190,.28)}
.eyebrow{margin:0;color:var(--mute);font-size:.95rem}
h1{font-weight:700;font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.4;margin:.1em 0 0;text-wrap:balance}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the scene: sky above the horizon at 40%, water below */
.river{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-low) 40%,var(--river-top) 40%,var(--river-bot) 100%);
  container-type:inline-size;height:clamp(320px,92vw,460px)}
.river.reveal{animation:fadein 1.2s ease both}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.pstars{position:absolute;left:0;right:0;top:0;height:36%}
.moon{position:absolute;left:68%;top:9%;width:clamp(56px,17cqw,96px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFFBE6,var(--moon) 58%,#D8C98F);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 48px 14px rgba(244,233,190,.28)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(160,140,80,.22)}
.moon::before{width:22%;height:22%;left:52%;top:30%}
.moon::after{width:14%;height:14%;left:30%;top:60%}
.hmoon::before,.hmoon::after{content:"";position:absolute;border-radius:50%;background:rgba(160,140,80,.22)}
.hmoon::before{width:22%;height:22%;left:52%;top:30%}
.hmoon::after{width:14%;height:14%;left:30%;top:60%}

.lantern{position:absolute;width:var(--w,12px);height:calc(var(--w,12px) * 1.3);border-radius:45% 45% 30% 30%;
  background:linear-gradient(180deg,#FFE3A0,#FF9A3C);box-shadow:0 0 14px 5px rgba(255,160,60,.55);
  animation:rise var(--d,30s) linear var(--dl,0s) infinite,sway 5s ease-in-out infinite alternate}
@keyframes rise{0%{top:38%;opacity:0}8%{opacity:.95}85%{opacity:.85}100%{top:-6%;opacity:0}}
@keyframes sway{from{transform:translateX(-8px)}to{transform:translateX(8px)}}

.shore{position:absolute;left:0;width:100%;top:calc(40% - 46px);height:46px;display:block}
.shore .sil{fill:var(--shore)}
.shore .lamp{fill:var(--flame);animation:twinkle 3s ease-in-out infinite alternate}

.reflect{position:absolute;left:68%;top:40%;width:20%;height:58%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 0%,rgba(244,233,190,.38),transparent 70%);filter:blur(8px)}
.ripples span{position:absolute;height:2px;border-radius:2px;background:rgba(236,239,250,.3);animation:shimmer 5s ease-in-out infinite alternate}
.ripples span.moonlit{background:rgba(244,233,190,.6)}
@keyframes shimmer{from{opacity:.08;transform:scaleX(.55)}to{opacity:.5;transform:scaleX(1.1)}}

.boat{position:absolute;width:clamp(84px,25cqw,150px);left:var(--l,30%);bottom:var(--b,24%);transform:translateX(-50%);
  transition:left var(--t,1.2s) var(--ease,ease-in-out),bottom var(--t,1.2s) var(--ease,ease-in-out)}
.boat::after{content:"";position:absolute;left:50%;top:80%;width:80%;height:24%;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,180,84,.4),transparent 70%);filter:blur(6px)}
.boat svg{display:block;width:100%;height:auto;overflow:visible}
.bob{position:relative;z-index:1;animation:bob 4.6s ease-in-out infinite}
.hers .bob{animation-delay:-2.1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-4px) rotate(1.2deg)}}
.kt .glow{opacity:.18;animation:glowp 2.4s ease-in-out infinite alternate}
@keyframes glowp{from{opacity:.12}to{opacity:.28}}
.kt .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.hers .kt .flame{animation-delay:-.7s}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.07) skewX(2deg)}60%{transform:scale(1.05,.95) skewX(-2deg)}}
.ember{position:absolute;left:50%;top:22%;width:3px;height:3px;border-radius:50%;background:#FFD27A;
  box-shadow:0 0 6px 2px rgba(255,190,90,.7);opacity:0;animation:ember 3.4s ease-out infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,0),-52px);opacity:0}}

.river[data-stage="ready"] .his{--l:30%;--b:24%}
.river[data-stage="ready"] .hers{--l:72%;--b:8%}
.river[data-stage="floated"] .his{--l:40%;--b:28%;--t:8s}
.river[data-stage="floated"] .hers{--l:67%;--b:26%;--t:8s}
.river[data-stage="drift"] .his{--l:52%;--b:32%;--t:70s;--ease:linear}
.river[data-stage="drift"] .hers{--l:79%;--b:30%;--t:70s;--ease:linear}

.wishfloat{position:absolute;left:67%;bottom:58%;max-width:72%;margin:0;text-align:center;
  font-weight:600;font-size:1.05rem;line-height:1.5;color:var(--moon);text-shadow:0 0 12px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transform:translate(-50%,10px);
  transition:opacity 1.4s ease,transform 6s ease-out}
.wishfloat.show{opacity:1;transform:translate(-50%,-34px)}
.wishfloat.show.gone{opacity:0}

/* wish box */
.panel.enter{animation:rise2 .6s ease both}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.field{display:grid;gap:6px}
.field label{font-size:1rem;color:var(--mute)}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:.75em 1em}
input[type=text]::placeholder{color:var(--mute);opacity:.8}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.btn{font:inherit;font-weight:700;min-height:50px;padding:.55em 2em;border-radius:999px;border:1px solid transparent;cursor:pointer;
  background:var(--flame);color:var(--on-flame);transition:transform .15s ease,background .2s ease}
.btn:hover{background:var(--flame-hi)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.done{margin:0;font-weight:700;font-size:clamp(1.2rem,4.6vw,1.5rem);line-height:1.6;color:var(--moon);text-align:center}
.done:focus{outline:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .lantern{animation:none !important;opacity:.85}
}
html{background:var(--night)}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div id="stars"></div></div>

<main class="wrap">
  <header class="head" id="head">
    <div class="hmoon" id="hmoon" aria-hidden="true"></div>
    <p class="eyebrow">ถึง <span id="toName">พี่คนสวย</span></p>
    <h1>ลอยกระทงด้วยกันนะ</h1>
  </header>

  <section class="river" id="river" data-stage="ready" aria-label="แม่น้ำยามค่ำ มีกระทงลอยอยู่" hidden>
    <div class="pstars" id="pstars" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div id="lanterns" aria-hidden="true"></div>
    <svg class="shore" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true">
      <g class="sil">
        <rect x="0" y="38" width="400" height="8"/>
        <ellipse cx="30" cy="36" rx="30" ry="12"/><ellipse cx="72" cy="38" rx="24" ry="9"/><ellipse cx="118" cy="37" rx="20" ry="7"/>
        <ellipse cx="316" cy="39" rx="18" ry="7"/><ellipse cx="350" cy="35" rx="34" ry="13"/><ellipse cx="392" cy="38" rx="20" ry="10"/>
        <rect x="190" y="35" width="40" height="11"/><rect x="195" y="30" width="30" height="6"/>
        <path d="M197 30C197 16 223 16 223 30Z"/><path d="M208 18H212L210 3Z"/>
      </g>
      <circle class="lamp" cx="58" cy="40" r="1.3"/><circle class="lamp" cx="96" cy="41" r="1.3" style="animation-delay:-1s"/>
      <circle class="lamp" cx="150" cy="40" r="1.3" style="animation-delay:-2s"/><circle class="lamp" cx="176" cy="41" r="1.3" style="animation-delay:-.5s"/>
      <circle class="lamp" cx="246" cy="40" r="1.3" style="animation-delay:-1.5s"/><circle class="lamp" cx="280" cy="41" r="1.3" style="animation-delay:-2.5s"/>
    </svg>
    <div class="reflect" aria-hidden="true"></div>
    <div class="ripples" id="ripples" aria-hidden="true"></div>
    <div class="boat his" id="boatHis"><div class="bob" aria-hidden="true"></div></div>
    <div class="boat hers" id="boatHers"><div class="bob" aria-hidden="true"></div></div>
    <p class="wishfloat" id="wishFloat"></p>
  </section>

  <div class="body">
    <section class="panel" id="p-make" aria-labelledby="h-make">
      <h2 class="sr-only" id="h-make">อธิษฐานและลอยกระทง</h2>
      <form id="wishForm" autocomplete="off">
        <div class="field">
          <label for="wish">คำอธิษฐาน</label>
          <input id="wish" type="text" maxlength="60" placeholder="เขียนสิ่งที่อยากขอ">
        </div>
        <div class="actions">
          <button class="btn" id="float" type="submit">ลอยกระทง</button>
        </div>
      </form>
    </section>
    <section class="panel" id="p-done" hidden>
      <p class="done" id="done" tabindex="-1" role="status">ลอยแล้ว ขอให้คำอธิษฐานเป็นจริงนะ</p>
    </section>
  </div>
</main>

<script>
(function () {
  var CONFIG = {
    toName: 'พี่คนสวย',
    fromName: 'หมาเด็ก',
    shortDate: '24 พ.ย. 2569'
  };
  var PETALS = {
    his: ['#E8E4F4', '#FFFFFF'],
    hers: ['#F58DAB', '#FFC4D6']
  };
  var $ = function (s) { return document.querySelector(s); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var river = $('#river');

  // send the wish to /api/wish, which forwards it to Telegram on the server
  function sendToTelegram(wish) {
    try {
      fetch('/api/wish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wish: wish }),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function krathong(p, name, u) {
    var back = [[30, 88, -40], [48, 86, -20], [70, 84, 0], [92, 86, 20], [110, 88, 40]];
    var front = [[22, 100, -58], [40, 102, -34], [58, 103, -12], [82, 103, 12], [100, 102, 34], [118, 100, 58]];
    function leaf(a, sc, fill) {
      return '<g transform="translate(' + a[0] + ' ' + a[1] + ') rotate(' + a[2] + ') scale(' + sc + ')">' +
        '<path d="M0 0C-9-12-8-26 0-40C8-26 9-12 0 0Z" fill="' + fill + '"/>' +
        '<path d="M0-4V-34" stroke="rgba(0,0,0,.2)" stroke-width="1.2" fill="none"/></g>';
    }
    function grad(id, a, b, isVar) {
      var st = isVar ? 'style="stop-color:' : 'stop-color="';
      return '<linearGradient id="' + id + u + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" ' + st + a + '"/><stop offset="1" ' + st + b + '"/></linearGradient>';
    }
    var fs = String(name).length > 9 ? 12 : 15;
    var s = '<svg class="kt" viewBox="0 0 140 130" style="--petal:' + p[0] + ';--petal2:' + p[1] + '" aria-hidden="true"><defs>' +
      grad('lb', '#5BA66A', '#24593C', false) +
      grad('lf', '#B4DE86', '#5A9C4C', false) +
      grad('pb', 'var(--petal)', 'var(--petal2)', true) +
      grad('pf', 'var(--petal2)', 'var(--petal)', true) +
      grad('fl', '#FFE9A8', '#FF9A2E', false) +
      grad('pq', '#FFF8E1', '#F0DDA8', false) +
      '</defs>';
    s += '<ellipse cx="70" cy="122" rx="52" ry="5" fill="rgba(0,0,0,.35)"/>';
    s += '<ellipse cx="70" cy="97" rx="58" ry="14" fill="#B9C97A"/>';
    s += '<ellipse cx="70" cy="94" rx="54" ry="11" fill="#DDE7A8"/>';
    s += '<ellipse cx="70" cy="94" rx="40" ry="7" fill="none" stroke="#B9C97A" stroke-width="1.2"/>';
    back.forEach(function (a) { s += leaf(a, 0.95, 'url(#lb' + u + ')'); });
    s += '<path d="M86 82L97 48M54 82L44 50" stroke="#9B6B3A" stroke-width="1.6" stroke-linecap="round" fill="none"/>';
    s += '<circle cx="97" cy="47.5" r="1.7" fill="#FF6B4A"/><circle cx="44" cy="49.5" r="1.7" fill="#FF6B4A"/>';
    [-62, -31, 0, 31, 62].forEach(function (a) {
      s += '<ellipse cx="70" cy="64" rx="8.5" ry="18" fill="url(#pb' + u + ')" transform="rotate(' + a + ' 70 82)" stroke="rgba(0,0,0,.14)" stroke-width=".8"/>';
    });
    s += '<rect x="66" y="48" width="8" height="30" rx="2" fill="#FFF3D6"/>';
    [-45, -15, 15, 45].forEach(function (a) {
      s += '<ellipse cx="70" cy="70" rx="7" ry="14" fill="url(#pf' + u + ')" transform="rotate(' + a + ' 70 86)" stroke="rgba(0,0,0,.12)" stroke-width=".8"/>';
    });
    s += '<circle class="glow" cx="70" cy="40" r="26" fill="#FFB454"/>';
    s += '<g class="flame"><path d="M70 27C76 35 78 41 70 47C62 41 64 35 70 27Z" fill="url(#fl' + u + ')"/>' +
         '<path d="M70 34C73 38 73 42 70 45C67 42 67 38 70 34Z" fill="#FFF6C8"/></g>';
    s += '<rect x="69.5" y="45" width="1" height="4" fill="#3A2A14"/>';
    front.forEach(function (a) { s += leaf(a, 0.8, 'url(#lf' + u + ')'); });
    s += '<rect x="26" y="97" width="88" height="23" rx="7" fill="url(#pq' + u + ')" stroke="#C79A4B" stroke-width="1"/>';
    s += '<text x="70" y="113.5" text-anchor="middle" font-size="' + fs + '" font-weight="700" fill="#4A2F10" style="font-family:var(--font-cute)">' + esc(name) + '</text>';
    return s + '</svg>';
  }

  var EMBERS = '<span class="ember" style="--dx:-10px"></span>' +
    '<span class="ember" style="--dx:8px;animation-delay:-1.2s"></span>' +
    '<span class="ember" style="--dx:-2px;animation-delay:-2.3s"></span>';

  // the waiting krathong carries the sender's name, the second one the recipient's
  $('#boatHis .bob').innerHTML = krathong(PETALS.his, CONFIG.fromName, 0) + EMBERS;
  $('#boatHers .bob').innerHTML = krathong(PETALS.hers, CONFIG.toName, 1) + EMBERS;
  river.setAttribute('aria-label', 'แม่น้ำยามค่ำ มีกระทงของ ' + CONFIG.fromName + ' และของ ' + CONFIG.toName + ' ลอยอยู่');

  // decorative: page stars, sky stars, lanterns, water ripples
  var i, el;
  function addStars(box, count, maxTop) {
    for (var k = 0; k < count; k++) {
      var e = document.createElement('span');
      var sz = (Math.random() * 1.8 + 0.8) + 'px';
      e.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * maxTop) + '%;width:' + sz + ';height:' + sz +
        ';animation-duration:' + (2.5 + Math.random() * 4) + 's;animation-delay:' + (-Math.random() * 5) + 's';
      box.appendChild(e);
    }
  }
  addStars($('#stars'), 64, 70);
  addStars($('#pstars'), 32, 100);

  var lan = $('#lanterns');
  for (i = 0; i < 7; i++) {
    el = document.createElement('span');
    el.className = 'lantern';
    var d = 24 + Math.random() * 20;
    el.style.cssText = 'left:' + (6 + Math.random() * 88) + '%;top:' + (8 + Math.random() * 26) + '%;--w:' + (9 + Math.random() * 6) + 'px;' +
      '--d:' + d + 's;--dl:' + (-Math.random() * d) + 's';
    lan.appendChild(el);
  }

  var rip = $('#ripples');
  for (i = 0; i < 18; i++) {
    el = document.createElement('span');
    el.style.cssText = 'left:' + (Math.random() * 88) + '%;top:' + (44 + Math.random() * 52) + '%;width:' + (6 + Math.random() * 14) + '%;' +
      'animation-duration:' + (4 + Math.random() * 4) + 's;animation-delay:' + (-Math.random() * 6) + 's';
    rip.appendChild(el);
  }
  for (i = 0; i < 8; i++) {
    el = document.createElement('span');
    el.className = 'moonlit';
    el.style.cssText = 'left:' + (60 + Math.random() * 12) + '%;top:' + (43 + Math.random() * 40) + '%;width:' + (3 + Math.random() * 5) + '%;' +
      'animation-duration:' + (3 + Math.random() * 3) + 's;animation-delay:' + (-Math.random() * 5) + 's';
    rip.appendChild(el);
  }

  $('#toName').textContent = CONFIG.toName;

  // step 1: write a wish. step 2 (after floating): reveal the river with both krathongs.
  var wf = $('#wishFloat');
  var floated = false;
  $('#wishForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (floated) { return; }
    floated = true;
    var wish = $('#wish').value.trim();
    sendToTelegram(wish);

    $('#p-make').hidden = true;
    $('#hmoon').hidden = true;
    $('#head').classList.add('compact');
    river.hidden = false;
    river.classList.add('reveal');
    river.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });

    // her krathong starts at the bank, then floats over to sit beside his
    setTimeout(function () {
      river.dataset.stage = 'floated';
      if (wish) {
        wf.textContent = wish;
        wf.classList.remove('show', 'gone');
        void wf.offsetWidth;
        wf.classList.add('show');
        setTimeout(function () { wf.classList.add('gone'); }, 6500);
      }
    }, reduce ? 100 : 1300);

    setTimeout(function () {
      var done = $('#p-done');
      done.hidden = false;
      done.classList.add('enter');
      $('#done').focus({ preventScroll: true });
    }, reduce ? 300 : 4600);

    setTimeout(function () { river.dataset.stage = 'drift'; }, 10000);
  });
})();
</script>

</body>
</html>
